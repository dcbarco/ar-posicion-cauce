<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FAF6DC" />
    <title>Mesa CAUCE</title>
    <link rel="icon" type="image/png" href="/logo/cauce-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #faf6dc;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #scene,
      #scene canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Raíz del DOM Overlay: todo lo que el visitante toca vive aquí. */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #gesture-layer {
        position: absolute;
        inset: 0;
        pointer-events: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="overlay">
      <div id="gesture-layer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
